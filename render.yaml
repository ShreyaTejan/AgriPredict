services:
  - type: web
    name: flask-backend
    env: python
    buildCommand: pip install -r server/requirements.txt
    startCommand: gunicorn server.app:app
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
    region: oregon

  - type: web
    name: react-frontend
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    plan: free
    region: oregon
