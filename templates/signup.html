<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agripredict</title>
    <link rel="shortcut icon" type="image/png" style="height: 70px;" href="/static/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('../static/signin.jpg');
            background-size: cover;
            background-position: center;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .glass-panel {
            background: rgba(74, 85, 104, 0.4);
            backdrop-filter: blur(5px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid white;
            color: white;
            outline: none;
            width: 100%;
            padding-bottom: 5px;
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="glass-panel w-[500px] p-10">
        <h1 class="text-white text-4xl font-light text-center mb-10">Sign Up</h1>
        
        <div class="mb-8">
            <input type="email" placeholder="Email" class="text-xl">
        </div>
        
        <div class="mb-12">
            <input type="password" placeholder="Password" class="text-xl">
        </div>

        <div class="mb-12">
            <input type="password" placeholder="Confirm Password" class="text-xl">
        </div>
        
        <button class="w-full bg-[#5cddfa] hover:bg-[#4acce9] text-black py-3 rounded-full text-xl mb-4">
            Sign Up
        </button>
        
        <div class="text-white text-center mb-6">or Sign Up with</div>
        
        <div class="flex justify-center gap-6 mb-8">
            <div class="social-icon bg-white">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
            </div>
            <div class="social-icon bg-[#1877f2]">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="white" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
            </div>
        </div>
        
        <div class="text-white text-center">
            Already have an account? <a href="/login" class="text-[#5cddfa] hover:underline">Log in</a>
        </div>
    </div>
</body>
</html>
