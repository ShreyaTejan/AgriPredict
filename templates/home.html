<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgriPredict</title>
	<link rel="shortcut icon" type="image/png" style="height: 70px;" href="/static/logo.png">
	<link rel="stylesheet" href="/static/home.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<script src="https://cdn.tailwindcss.com"></script>
	<style>
		:root {
		  --primary-color: rgb(21, 31, 20); /* Dark green from image */
		  --accent-color: #4caf50; /* Lighter green for accents */
		  --text-light: #f5f5f5;
		  --text-dark: #333333;
		  --background-light: #ffffff;
		  --overlay-dark: rgba(10, 31, 10, 0.8);
		}</style>
  </head>
  
  <body>
  <!--=======================navbar=====================================================-->
 

<!-- HTML -->
<nav class="bg-[#151F14] fixed top-0 left-0 right-0 z-1000 shadow-md px-10 py-[35px] flex justify-between items-center mb-[80px]">
	<div class="logo flex items-center">
	  <img src="../static/logo.png" alt="Logo" class="h-12 mr-2" />
	  <span class="text-lg font-bold text-[#f5f5f5]">Agri<span class="text-[#4caf50;]">Predict</span></span>
	</div>
	<ul class="nav-links flex list-none text-[#f5f5f5]">
	  <li class="ml-14">
		<a href="/" class="text-text-light hover:text-[#4caf50;] transition-colors duration-300">Home</a>
	  </li>
	  <li class="ml-14">
		<a href="#features" class="text-text-light hover:text-[#4caf50;] transition-colors duration-300">Features</a>
	  </li>
	  <li class="ml-14">
		<a href="#how_it_works" class="text-text-light hover:text-[#4caf50;] transition-colors duration-300">How It Works</a>
	  </li>
	  <li class="ml-14">
		<a href="/resources" class="text-text-light hover:text-[#4caf50;] transition-colors duration-300">Resources</a>
	  </li>
	  <li class="ml-14">
		<a href="/contact" class="text-text-light hover:text-[#4caf50;] transition-colors duration-300">Contact</a>
	  </li>
	</ul>
	<a href="/signup" class="bg-transparent text-[#4caf50;] border-2 border-[#4caf50;] px-6 py-2 rounded-full font-bold hover:bg-[#4caf50;] hover:text-white transition-colors duration-300">
	  Sign Up <span class="icon">→</span>

<!--==========================================================================================-->
  <div class="container my-3">
      <h1 class="heading mt-24">Predict Your Crop<span class="text-success">🌱</span></h1>

<!--      adding form-->
      <form action="/predict" method="POST">
          <div class="row">
              <div class="col-md-4">
					<label for="Nitrogen">Nitrogen</label>
					<input type="number" id="Nitrogen" name="Nitrogen" placeholder="Enter % of Nitrogen" class="form-control" required step="0">
				</div>
               <div class="col-md-4">
					<label for="Phosporus">Phosphorus</label>
					<input type="number" id="Phosporus" name="Phosporus" placeholder="Enter % of Phosphorus" class="form-control" required step="00">
				</div>
				<div class="col-md-4">
					<label for="Potassium">Potassium</label>
					<input type="number" id="Potassium" name="Potassium" placeholder="Enter % of Potassium" class="form-control" required step="0">
				</div>
          </div>

          <div class="row mt-4">
				<div class="col-md-4">
					<label for="Temperature">Temperature</label>
					<input type="number" step="0.01" id="Temperature" name="Temperature" placeholder="Enter Temperature in °C" class="form-control" required step="0">
				</div>
				<div class="col-md-4">
					<label for="Humidity">Humidity</label>
					<input type="number" step="0.01" id="Humidity" name="Humidity" placeholder="Enter Humidity in %" class="form-control" required step="0">
				</div>
				<div class="col-md-4">
					<label for="pH">pH</label>
					<input type="number" step="0.01" id="pH" name="pH" placeholder="Enter pH value" class="form-control" required step="0">
				</div>
			</div>

          <div class="row mt-4">
				<div class="col-md-4">
					<label for="Rainfall">Rainfall</label>
					<input type="number" step="0.01" id="Rainfall" name="Rainfall" placeholder="Enter Rainfall in mm" class="form-control" required>
				</div>
			</div>

			<div class="row mt-4">

				<div class="col-md-12 text-center">
					 <button type="submit" class="btn btn-success btn-lg">Get Recommendation</button>
					 {% if result %}
						<div class="card bg-white ml-[500px]" style="width: 28rem;">
						<img src="{{url_for('static', filename='crop.png')}}" style="height: 150px; width: 120px;" class="card-img-top" alt="...">
						<div class="card-body">
							<p class="card-text" style="margin-top: -20px;">{{ result }} </p>
						</div>
						</div>
					{% endif %}
				 </div>
				 </div>
      </form>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous">
		document.getElementsByClassName("btn").addEventListener("click", function() {
  		document.querySelector(".card").style.display = "block";
		});
	</script>
  </body>
</html>
